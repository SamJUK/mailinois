name: ci

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # weekly, so new vulnerabilities in Go or a dependency show up without a push

jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mailinois
          POSTGRES_PASSWORD: mailinois
          POSTGRES_DB: mailinois_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mailinois"
          --health-interval 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: go test ./...
        env:
          MAILINOIS_TEST_DATABASE_URL: postgres://mailinois:mailinois@localhost:5432/mailinois_test
      - run: docker build .
